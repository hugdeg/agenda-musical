<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter un concert - Agenda</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 22px; margin-bottom: 20px; color: #38bdf8; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
    input[type="file"], textarea { width: 100%; padding: 12px; margin-bottom: 20px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; box-sizing: border-box; }
    textarea { height: 120px; resize: vertical; }
    button { background: #0284c7; color: white; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button:active { background: #0369a1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ajouter un Événement</h1>
    <form id="concertForm">
      <label for="affiche">Affiche du concert (Photo)</label>
      <input type="file" id="affiche" accept="image/*">

      <label for="contenu">Lien ou Informations textuelles</label>
      <textarea id="contenu" placeholder="Colle le lien de l'événement (Shotgun, site de salle, Facebook) ou écris les détails ici..."></textarea>

      <button type="submit">Envoyer à l'Agent n8n</button>
    </form>
  </div>

  <script>
    document.getElementById('concertForm').onsubmit = async (e) => {
      e.preventDefault();
      const webhookUrl = "TON_URL_DE_WEBHOOK_N8N_ICI"; // Remplace par ton URL n8n
      
      const fileInput = document.getElementById('affiche');
      const contenu = document.getElementById('contenu').value;

      const formData = new FormData();
      formData.append('contenu', contenu);
      if (fileInput.files[0]) {
        formData.append('affiche', fileInput.files[0]);
      }

      alert("Envoi en cours vers n8n...");
      
      try {
        const response = await fetch(webhookUrl, {
          method: 'POST',
          body: formData
        });
        if (response.ok) {
          alert("Événement envoyé avec succès ! Il va être analysé.");
          document.getElementById('concertForm').reset();
        } else {
          alert("Erreur lors de l'envoi.");
        }
      } catch (err) {
        console.error(err);
        alert("Erreur de connexion au webhook.");
      }
    };
  </script>
</body>
</html>
